<!DOCTYPE html>
<html lang="fi">
    <!--Perustelu: selaimet, hakukoneet ja esimerkiksi ruudunlukijat tietävät, että sivun kieli on suomi.-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/Tuntiharjoitukset/kuvat/favicon.svg">
    
    <meta property="og:title" content="HTML-opas">
    <meta property="og:description" content="Opiskele HTML käytännössä.">
    <meta property="og:image" content="https://kodarit.com/fi/html-opas/og.jpg">
    <meta property="og:url" content="https://kodarit.com/fi/html-opas/">

    <meta name="description" content="HTML-harjoitus, jossa opetellaan faviconin, head-elementtien ja Open Graph -metatietojen käyttöä.">
    <!-- Perustelu: description antaa hakukoneelle tiiviin kuvauksen sivun sisällöstä ja sitä voidaan käyttää hakutuloksen kuvauksena.-->

    <meta name="robots" content="noindex, nofollow">
    <!--Harjoitussivua ei ole tarkoitettu Googlen hakutuloksiin, joten noindex estää hakukonetta indeksoimasta sivua.-->
    

    <title>HTML Favicon -harjoitus | HTML-opas</title>
    <!-- Perustelu: käyttäjä ja hakukone ymmärtävät heti, mitä sivu käsittelee. --> 

</head>
<body>
    <h1>Favicon harjoitus</h1>
    <p>Tässä opeteltiin lisäämään favicon välilehteen. Head harjoitus sekä Og-meta-tagit.</p>
</body>
</html>
