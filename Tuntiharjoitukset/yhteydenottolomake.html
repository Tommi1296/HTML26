<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteydenottolomake</title>
</head>
<body>
    <h1>Yhteydenottolomake</h1>
    <form action="lomake.php" method="post">
        <label for="nimi">Nimi:</label>
        <input type="text" id="nimi" name="nimi" required><br><br>
        <label for="sahkoposti">Sähköposti:</label>
        <input type="email" id="sahkoposti" name="sahkoposti" required><br><br>
        <label for="aihe">Aihe:</label>
        <input type="text" id="aihe" name="aihe" required><br><br>
        <label for="viesti">Viesti:</label>
        <textarea id="viesti" name="viesti" required></textarea><br><br>
        <autocomplete="on"> <minlength="10" maxlength="500"> <required> <pattern="[A-Za-z0-9\s]+" title="Vain kirjaimia ja numeroita"><br><br>
        <input type="submit" value="Lähetä">
    </form>
</body>
</html>
