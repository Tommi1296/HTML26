<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröityminen</title>
</head>
<body>
    <style>
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 50%;
            padding: 5px;
            margin-bottom: 10px;
        }
        input[type="checkbox"] {
            margin-bottom: 10px;
        }
        input[type="submit"] {
            padding: 5px 10px;
        }
    </style>
    <h1>Rekisteröityminen</h1>
    <input type="text" id="nimi" name="nimi" placeholder="Nimi" required><br><br>
    <input type="email" id="sahkoposti" name="sahkoposti" placeholder="Sähköposti" required><br><br>
    <input type="password" id="salasana" name="salasana" placeholder="Salasana" required><br><br>
    <input type="date" id="syntymapaiva" name="syntymapaiva" placeholder="Syntymäpäivä" required><br><br>
    <input type="checkbox"  id="ehdot" name="ehdot" required> Hyväksyn käyttöehdot<br><br>
    <input type="submit" value="Rekisteröidy">
</body>
</html>
