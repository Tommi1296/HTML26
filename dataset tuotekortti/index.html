<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset-tuotekortti</title>
</head>

<body>

    <h1>Tuotteet</h1>

    <div>
        <h2>Näyttö</h2>
        <p>Hinta: 199 €</p>

        <button
            data-id="101"
            data-name="Näyttö"
            data-price="199">
            Lisää koriin
        </button>
    </div>

    <div>
        <h2>Näppäimistö</h2>
        <p>Hinta: 79 €</p>

        <button
            data-id="102"
            data-name="Näppäimistö"
            data-price="79">
            Lisää koriin
        </button>
    </div>

    <script>
        const buttons = document.querySelectorAll("button");

        buttons.forEach(function(button) {
            button.addEventListener("click", function() {

                const id = button.dataset.id;
                const name = button.dataset.name;
                const price = Number(button.dataset.price);

                console.log("Tuotteen ID:", id);
                console.log("Tuotteen nimi:", name);
                console.log("Tuotteen hinta:", price);
            });
        });
    </script>

</body>
</html>
